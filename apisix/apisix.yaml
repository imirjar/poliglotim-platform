routes:
  - id: courses-route
    uri: /courses
    upstream:
      pass_host: node
      nodes:
        "courses:6060": 1
      type: roundrobin
    plugins:
      cors:
        allow_origins: "http://localhost"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600

  - id: keycloak-realms
    uri: /realms/*
    upstream:
      nodes:
        "keycloak:8080": 1
      type: roundrobin

  - id: keycloak-resources
    uri: /resources/*
    upstream:
      nodes:
        "keycloak:8080": 1
      type: roundrobin

  - id: protected-courses-content
    uris:
      - /chapters
      - /chapters/*
      - /lessons
      - /lessons/*
    upstream:
      pass_host: node
      nodes:
        "courses:6060": 1
      type: roundrobin
    plugins:
      cors:
        allow_origins: "http://localhost"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600

      openid-connect:
        client_id: apisix
        client_secret: apisix-secret
        discovery: http://127.0.0.1:9080/realms/study/.well-known/openid-configuration
        bearer_only: true
        realm: "study"
        scope: openid profile email
        unauth_action: "deny"

#END