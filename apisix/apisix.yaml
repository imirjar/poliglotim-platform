plugin_configs:
  - id: protected
    plugins:
      openid-connect:
        client_id: apisix
        client_secret: apisix-secret
        discovery: "http://keycloak:8080/realms/study/.well-known/openid-configuration"
        bearer_only: false  # чтобы работал редирект
        realm: "study"
        scope: "openid profile email"
        redirect_uri: "http://localhost:9080/protected/callback"
        logout_path: "/protected/logout"
        post_logout_redirect_uri: "http://localhost:9080/"
        session:
          secret: "ваш-очень-длинный-и-случайный-секрет-32+символов"
        ssl_verify: false  # для http://keycloak

upstreams:
  - id: study
    type: roundrobin
    nodes:
      "courses:6060": 1
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1

routes:
  - id: keycloak-realms
    uri: "/realms*"
    upstream_id: keycloak
  - id: keycloak-resources
    uri: "/resources*"
    upstream_id: keycloak
  - id: courses 
    uri: "/courses*"
    upstream_id: study
  - id: protected-callback
    uri: "/protected*"
    plugin_config_id: protected
    upstream_id: study
  - id: chapters
    uri: "/chapters*"
    plugin_config_id: protected
    upstream_id: study
  - id: lessons  
    uri: "/lessons*"
    plugin_config_id: protected
    upstream_id: study
#END
