plugin_configs:
  - id: protected
    plugins:
      cors:
        allow_origins: "http://app.dev.plyglo.com"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Origin,Referer,User-Agent"
        expose_headers: "*"
        max_age: 3600
      openid-connect:
        client_id: apisix
        client_secret: apisix-secret
        discovery: "http://keycloak:8080/realms/study/.well-known/openid-configuration"
        introspection_endpoint: "http://keycloak:8080/realms/study/protocol/openid-connect/token/introspect"
        bearer_only: true
        realm: "study"
        scope: "openid profile email"
        unauth_action: "deny"
        ssl_verify: false  # для http://keycloak

upstreams:
  - id: api
    type: roundrobin
    nodes:
      "courses:6060": 1
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: app
    type: roundrobin
    nodes:
      "app:80": 1
  - id: site
    type: roundrobin
    nodes:
      "site:80": 1

routes:
  - id: app
    uri: "/*"
    host: "app.dev.plyglo.com"
    upstream_id: app
  - id: keycloak-realms
    uri: "/realms*"
    host: "auth.dev.plyglo.com"
    upstream_id: keycloak
    plugins:
      cors:
        allow_origins: "http://app.dev.plyglo.com"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Origin,Referer,User-Agent"
        expose_headers: "*"
        max_age: 3600
  - id: keycloak-resources
    uri: "/resources*"
    host: "auth.dev.plyglo.com"
    upstream_id: keycloak
    plugins:
      cors:
        allow_origins: "http://app.dev.plyglo.com"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Origin,Referer,User-Agent"
        expose_headers: "*"
        max_age: 3600
  - id: courses 
    uri: "/courses*"
    host: "api.dev.plyglo.com"
    upstream_id: api
    plugins:
      cors:
        allow_origins: "http://app.dev.plyglo.com"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Origin,Referer,User-Agent"
        expose_headers: "*"
        max_age: 3600
  - id: protected-callback
    uri: "/protected*"
    host: "api.dev.plyglo.com"
    plugin_config_id: protected
    upstream_id: api
  - id: chapters
    uri: "/chapters*"
    host: "api.dev.plyglo.com"
    plugin_config_id: protected
    upstream_id: api
  - id: lessons  
    uri: "/lessons*"
    host: "api.dev.plyglo.com"
    plugin_config_id: protected
    upstream_id: api
  - id: site
    uri: "/*"
    host: "dev.plyglo.com"
    upstream_id: site
#END
