routes:
  - id: keycloak-realms
    uri: /realms/*
    upstream:
      nodes:
        "keycloak:8080": 1
      type: roundrobin
    plugins:
      cors:
        allow_origins: "http://localhost,http://localhost:80,com.poliglotim.app://"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600

  - id: keycloak-resources
    uri: /resources/*
    upstream:
      nodes:
        "keycloak:8080": 1
      type: roundrobin
    plugins:
      cors:
        allow_origins: "http://localhost,http://localhost:80,com.poliglotim.app://"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600

  - id: courses-route
    uri: /courses
    upstream:
      nodes:
        "courses:6060": 1
      type: roundrobin
    plugins:
      cors:
        allow_origins: "http://localhost,http://localhost:80,com.poliglotim.app://"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600

  - id: protected-courses-content
    uris:
      - /chapters
      - /chapters/*
      - /lessons
      - /lessons/*
    upstream:
      nodes:
        "courses:6060": 1
      type: roundrobin
    plugins:
      cors:
        allow_origins: "http://localhost,http://localhost:80,com.poliglotim.app://"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600

      openid-connect:
        client_id: apisix
        client_secret: apisix-secret
        discovery: http://keycloak:8080/realms/study/.well-known/openid-configuration
        bearer_only: true
        realm: "study"
        scope: "openid profile email"
        unauth_action: "deny"
        # Дополнительные полезные параметры:
        ssl_verify: false  # Только для разработки
        timeout: 10
        set_access_token_header: true