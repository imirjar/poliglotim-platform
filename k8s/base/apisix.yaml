apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: poliglotim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      initContainers:
        - name: render-apisix-config
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              APISIX_CLIENT_SECRET="$(cat /secrets/APISIX_CLIENT_SECRET)"
              APISIX_SESSION_SECRET="$(cat /secrets/APISIX_SESSION_SECRET)"
              sed \
                -e "s|__APISIX_CLIENT_SECRET__|${APISIX_CLIENT_SECRET}|g" \
                -e "s|__APISIX_SESSION_SECRET__|${APISIX_SESSION_SECRET}|g" \
                /config-src/apisix.yaml > /config-out/apisix.yaml
              cp /config-src/config.yaml /config-out/config.yaml
          volumeMounts:
            - name: apisix-config-src
              mountPath: /config-src
            - name: apisix-config
              mountPath: /config-out
            - name: apisix-secret
              mountPath: /secrets
              readOnly: true
      containers:
        - name: apisix
          image: apache/apisix:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: apisix-config-src
          configMap:
            name: apisix-config
        - name: apisix-config
          emptyDir: {}
        - name: apisix-secret
          secret:
            secretName: poliglotim-secrets
            items:
              - key: APISIX_CLIENT_SECRET
                path: APISIX_CLIENT_SECRET
              - key: APISIX_SESSION_SECRET
                path: APISIX_SESSION_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: poliglotim
spec:
  type: LoadBalancer
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
    - name: https
      port: 443
      targetPort: 9443
