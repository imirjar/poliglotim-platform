apiVersion: apps/v1
kind: Deployment
metadata:
  name: courses
  namespace: poliglotim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courses
  template:
    metadata:
      labels:
        app: courses
    spec:
      containers:
        - name: courses
          image: ghcr.io/imirjar/poliglotim-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6060
              name: http
          env:
            - name: PORT
              value: "6060"
            - name: DB_CONN
              valueFrom:
                secretKeyRef:
                  name: poliglotim-secrets
                  key: DB_CONN
          readinessProbe:
            tcpSocket:
              port: 6060
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6060
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: courses
  namespace: poliglotim
spec:
  selector:
    app: courses
  ports:
    - name: http
      port: 6060
      targetPort: 6060
