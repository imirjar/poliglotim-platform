services:

  courses:
    image: ghcr.io/imirjar/poliglotim-api:latest
    container_name: poliglotim-api
    restart: unless-stopped
    environment:
      PORT: "6060"
      DB_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "6060:6060"
    networks:
      - platform-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ${S3_SQL_DUMP}:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
