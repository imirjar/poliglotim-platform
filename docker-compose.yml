services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt
    networks:
      - platform-network

  app:
    image: ghcr.io/imirjar/poliglotim-app:latest
    # build:
    #   context: /Users/artemzadorov/development/flutter/examples/poliglotim
    #   dockerfile: Dockerfile
    # image: poliglotim-app:local
    # restart: always
    ports:
      - "3000:80"
    environment:
      #API
      - API_BASE_URL=${API_BASE_URL}
      - API_UPSTREAM_PATH=${API_UPSTREAM_PATH:-}
      #KEYCLOAK
      - AUTH_BASE_URL=${AUTH_BASE_URL}
      - AUTH_UPSTREAM_PATH=${AUTH_UPSTREAM_PATH}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
    depends_on:
      - courses
      - keycloak
    networks:
      - platform-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-web.rule=Host(`app.dev.plyglo.com`) || Host(`app.test.plyglo.com`) || Host(`app.plyglo.com`)
      - traefik.http.routers.app-web.entrypoints=web
      - traefik.http.routers.app-web.service=app
      - traefik.http.routers.app-secure.rule=Host(`app.plyglo.com`)
      - traefik.http.routers.app-secure.entrypoints=websecure
      - traefik.http.routers.app-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.app-secure.service=app
      - traefik.http.services.app.loadbalancer.server.port=80

  site:
    image: ghcr.io/imirjar/poliglotim-site:latest
    restart: always
    ports:
      - "8000:80"
    networks:
      - platform-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.site-web.rule=Host(`dev.plyglo.com`) || Host(`test.plyglo.com`) || Host(`plyglo.com`)
      - traefik.http.routers.site-web.entrypoints=web
      - traefik.http.routers.site-web.service=site
      - traefik.http.routers.site-secure.rule=Host(`plyglo.com`)
      - traefik.http.routers.site-secure.entrypoints=websecure
      - traefik.http.routers.site-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.site-secure.service=site
      - traefik.http.services.site.loadbalancer.server.port=80

  courses:
    image: ghcr.io/imirjar/poliglotim-api:latest
    container_name: poliglotim-api
    restart: unless-stopped
    environment:
      PORT: "6060"
      DB_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # expose:
    #   - "6060"
    ports:
      - "6060:6060"
    networks:
      - platform-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-web.rule=Host(`api.dev.plyglo.com`) || Host(`api.test.plyglo.com`) || Host(`api.plyglo.com`)
      - traefik.http.routers.api-web.entrypoints=web
      - traefik.http.routers.api-web.service=api
      - traefik.http.routers.api-secure.rule=Host(`api.plyglo.com`)
      - traefik.http.routers.api-secure.entrypoints=websecure
      - traefik.http.routers.api-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.api-secure.service=api
      - traefik.http.services.api.loadbalancer.server.port=6060

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${AUTH_ORIGIN}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - platform-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth-web.rule=Host(`auth.dev.plyglo.com`) || Host(`auth.test.plyglo.com`) || Host(`auth.plyglo.com`)
      - traefik.http.routers.auth-web.entrypoints=web
      - traefik.http.routers.auth-web.service=auth
      - traefik.http.routers.auth-secure.rule=Host(`auth.plyglo.com`)
      - traefik.http.routers.auth-secure.entrypoints=websecure
      - traefik.http.routers.auth-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.auth-secure.service=auth
      - traefik.http.services.auth.loadbalancer.server.port=8080

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${S3_SQL_DUMP}:/docker-entrypoint-initdb.d/dump.sql
    ports:
      - "5432:5432"
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
